name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install runtime and validation dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - run: ruff check .
      - run: ruff format --check .
      - name: Python regressions and coverage
        run: pytest --cov=netwatch --cov-report=term-missing --cov-report=xml --cov-fail-under=96
      - name: JavaScript syntax and isolated UI behaviour
        run: |
          node --check netwatch/web/static/app.js
          for file in tests/*.mjs; do node --check "$file"; done
          node tests/dashboard_polling.mjs
          node tests/mobile_ui.mjs
          node tests/check_investigation_ui.mjs
      - name: Privacy and documentation validation
        run: python scripts/check_publication.py
      - name: Runtime dependency vulnerability audit
        run: python -m pip_audit -r requirements.txt
      - name: Package build and version
        run: |
          python -m build
          netwatch --version

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all reachable history and working tree
        run: |
          "$RUNNER_TEMP/gitleaks" git . --log-opts="--all" --redact=100 --no-banner
          "$RUNNER_TEMP/gitleaks" dir . --redact=100 --no-banner

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build -t netwatch:test .
      - run: docker run --rm --network none netwatch:test --version
      - run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true netwatch:test --json devices
      - run: cp netwatch.example.yaml netwatch.yaml
      - run: docker compose config --quiet
