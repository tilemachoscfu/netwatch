[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "netwatch-lan"
version = "0.1.0"
description = "Private LAN discovery, historical device inventory, and monitoring"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "NetWatch contributors"}]
dependencies = ["PyYAML>=6.0.2,<7", "Flask>=3.1.2,<4", "waitress>=3.0.2,<4"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
netwatch = "netwatch.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["netwatch"]

[tool.hatch.build]
exclude = ["data/**", "netwatch.yaml", ".env*", "**/*.secrets", "**/*.web-key", "**/*.web-auth", ".venv/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.coverage.run]
source = ["netwatch"]
branch = true

[tool.coverage.report]
show_missing = true
