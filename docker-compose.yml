services:
  netwatch:
    build: .
    image: netwatch:local
    init: true
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NETWATCH_CONFIG: /etc/netwatch/netwatch.yaml
      NETWATCH_DATABASE_PATH: /data/netwatch.db
    volumes:
      - netwatch-data:/data
      - ./netwatch.yaml:/etc/netwatch/netwatch.yaml:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 120s
    healthcheck:
      test: [CMD, netwatch, healthcheck]
      interval: 60s
      timeout: 15s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  netwatch-data:
